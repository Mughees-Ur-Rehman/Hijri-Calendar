<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hijri Date Converter</title>
    
    <!-- Google Search Console Verification Tag -->
    <meta name="google-site-verification" content="f6v2PId_lHTSw3EaHCuHtEygqz_q8bmKLmjIgHwzyf4" />
    
    <!-- Favicon Link -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Hijri Date Converter</h2>
        <p class="subtitle">Convert Gregorian (English) dates to Islamic Hijri dates easily.</p>
        
        <div class="input-group">
            <label for="gregorianDate">Select English Date:</label>
            <input type="date" id="gregorianDate">
        </div>

        <button id="convertBtn">Convert Date</button>

        <div class="result-box" id="resultBox">
            <h3>Converted Hijri Date:</h3>
            <p id="hijriResult">Select a date and click convert</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
